<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GWARZ DayZ — Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html#top" class="logo">GWARZ</a>
    <nav class="nav">
      <a href="index.html#gallery">Gallery</a>
      <a href="index.html#connect">Connect</a>
      <a href="index.html#rules">Rules</a>
      <a href="index.html#support">Support</a>
      <a href="wheel.html">Roulette</a>
      <a href="shop.html">Shop</a>
      <a href="vehicles.html">Vehicles</a>
      <a href="account.html">Account</a>
    </nav>
    <div class="header-right">
      <div id="profile-widget" class="profile-widget"></div>
      <a class="btn btn-ghost" href="#" data-discord-link target="_blank" rel="noopener">Discord</a>
    </div>
  </div>
</header>

<main>
  <section class="section account-section">
    <div class="wrap">
      <h1>Your GWARZ Account</h1>
      <p class="section-note">Log in and link your Steam and Discord accounts. Head to the <a href="wheel.html">Roulette page</a> to spin for loot once you're linked.</p>

      <div id="status-message" class="status-message" hidden></div>

      <div id="logged-out-view" hidden>
        <button id="discord-login-btn" class="btn btn-primary">Log in with Discord</button>
      </div>

      <div id="logged-in-view" hidden>
        <div class="card account-card">
          <h2>Linked Accounts</h2>
          <div class="server-row">
            <span class="server-label">Discord</span>
            <span id="discord-status" class="server-value">—</span>
          </div>
          <div class="server-row">
            <span class="server-label">Steam</span>
            <span id="steam-status" class="server-value">—</span>
          </div>
          <button id="steam-link-btn" class="btn btn-primary" hidden>Link Steam Account</button>
        </div>

        <button id="logout-btn" class="btn btn-ghost stacked-card">Log out</button>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span>&copy; <span data-year></span> GWARZ DayZ</span>
    <div class="footer-links">
      <a href="#" data-discord-link target="_blank" rel="noopener">Discord</a>
      <a href="#" data-cashapp-link target="_blank" rel="noopener">CashApp</a>
      <a href="#" data-paypal-link target="_blank" rel="noopener">PayPal</a>
    </div>
  </div>
</footer>

<script src="script.js"></script>
<script src="account.js"></script>
<script src="profile-widget.js"></script>
</body>
</html>
